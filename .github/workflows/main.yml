name: Build CRACKER Wingo Scanner EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      - name: Bundle Tesseract
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\Tesseract-OCR" "Tesseract-OCR" -Recurse

      - name: Configure bundled OCR
        shell: pwsh
        run: |
          $p = "cracker_wingo_scanner.py"
          $s = Get-Content $p -Raw
          $replacement = @'
          import pytesseract
          import os
          if getattr(sys, "frozen", False):
              _tess = Path(sys._MEIPASS) / "Tesseract-OCR"
              pytesseract.pytesseract.tesseract_cmd = str(_tess / "tesseract.exe")
              os.environ["TESSDATA_PREFIX"] = str(_tess / "tessdata")
          '@
          $s = $s.Replace("import pytesseract", $replacement)
          Set-Content $p $s

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CrackerWingoScanner --add-data "Tesseract-OCR;Tesseract-OCR" cracker_wingo_scanner.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CRACKER-Wingo-Scanner
          path: dist/CrackerWingoScanner.exe
